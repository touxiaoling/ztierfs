[project]
name = "ztierfs"
version = "0.3.0"
description = "macOS FUSE filesystem: content-addressed blocks with dedup/zstd compression, and hot/cold tiering"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "loguru>=0.7.3",
    "macfusepy>=0.6.0",
    "rich>=15.0.0",
    "typer>=0.25.1",
]
classifiers = ["Operating System :: MacOS :: MacOS X"]


[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "ty>=0.0.37",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "benchmark: performance benchmarks that are useful for local comparison",
    "integration: tests that require an opt-in real FUSE mount",
]
